name: Release deployment

on:
  release:
    types: [created]

jobs:
  build-and-attach-tar:
    name: Build and attach Docker tar deployment
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker tar
        run: make docker-image

      - name: Rename tar with version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: mv datawrapper-mcp.tar datawrapper-mcp-${VERSION}.tar

      - name: Upload tar to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$VERSION" \
            "datawrapper-mcp-${VERSION}.tar" \
            --clobber
